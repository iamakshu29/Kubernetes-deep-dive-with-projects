apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  creationTimestamp: null
  name: app-ingress
spec:
  tls:
  - hosts:
    - localhost
    - frontend.team-alpha.svc.cluster.local
    - frontend.team-alpha.svc
    - frontend.team-alpha
    secretName: alpha-tls-secret
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - backend:
          service:
            name: frontend
            port:
              number: 80
        path: /
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 80
        path: /api
        pathType: Prefix
status:
  loadBalancer: {}
