apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: secure-deploy
  name: secure-deploy
  namespace: team-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-deploy
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: secure-deploy
    spec:
      serviceAccountName: cicd-deployer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - image: busybox:latest
        name: busybox
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
status: {}
