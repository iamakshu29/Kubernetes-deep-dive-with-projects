# Default values for onlineboutique.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

images:
  repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

serviceAccounts:
  # Specifies whether service accounts should be created.
  create: true
  # Annotations to add to the service accounts.
  annotations: {}
  # Annotations to add only for the cartservice app. This allows to follow the least privilege principle where only cartservice needs to connect to external database for example via Workload Identity.
  annotationsOnlyForCartservice: false

networkPolicies:
  # Specifies if the NetworkPolicies are created or not. If true, one fine granular NetworkPolicy per app is created.
  create: false

opentelemetryCollector:
  create: false
  name: opentelemetrycollector
  # Specifies the project id for the otel collector. If set as "PROJECT_ID" (default value), an initContainer will automatically retrieve the project id value from the metadata server.
  projectId: "PROJECT_ID"

googleCloudOperations:
  profiler: false
  tracing: false
  metrics: false

seccompProfile:
  enable: false
  type: RuntimeDefault

securityContext:
  enable: true

adService:
  create: true
  name: adservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 3, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 200m
      memory: 180Mi
    limits:
      cpu: 300m
      memory: 300Mi

cartService:
  create: true
  name: cartservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 4, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

checkoutService:
  create: true
  name: checkoutservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 4, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

currencyService:
  create: true
  name: currencyservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 4, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

emailService:
  create: true
  name: emailservice
  antiAffinity: false
  hpa: { enabled: false }
  pdb: { enabled: false }
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

frontend:
  create: true
  name: frontend
  externalService: true
  cymbalBranding: false
  platform: local
  singleSharedSession: false
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 5, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

loadGenerator:
  create: true
  name: loadgenerator
  checkFrontendInitContainer: true
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

paymentService:
  create: true
  name: paymentservice
  antiAffinity: false
  hpa: { enabled: false }
  pdb: { enabled: false }
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

productCatalogService:
  create: true
  name: productcatalogservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 5, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  extraLatency: ""
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

recommendationService:
  create: true
  name: recommendationservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 4, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 100m
      memory: 220Mi
    limits:
      cpu: 200m
      memory: 450Mi

shippingService:
  create: true
  name: shippingservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 3, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

cartDatabase:
  # Specifies the type of the cartservice's database, could be either redis or spanner.
  type: redis
  connectionString: "redis-cart:6379"
  inClusterRedis:
    create: true
    name: redis-cart
    # Uses the public redis image from Docker Hub, otherwise will use the images.repository.
    publicRepository: true

# @TODO: This service is not currently available in Helm.
# https://github.com/GoogleCloudPlatform/microservices-demo/tree/main/kustomize/components/shopping-assistant
shoppingAssistantService:
  create: false
  name: shoppingassistantservice

# -------------------------------------------------------
# ResourceQuota
# -------------------------------------------------------
resourceQuota:
  configmaps: "12"
  limitsCpu: "6"
  limitsMemory: 8Gi
  requestsCpu: "3"
  requestsMemory: 4Gi
  persistentVolumeClaims: "5"
  secrets: "4"

# -------------------------------------------------------
# LimitRange
# -------------------------------------------------------
limitRange:
  default:
    cpu: 200m
    memory: 128Mi
  defaultRequest:
    cpu: 100m
    memory: 64Mi
  max:
    cpu: 500m
    memory: 512Mi
  min:
    cpu: 50m
    memory: 64Mi

# -------------------------------------------------------
# Ingress
# -------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: ""  # empty matches all hosts

# -------------------------------------------------------
# Kyverno Policies
# -------------------------------------------------------
kyvernoPolicies:
  enabled: false
  # Audit = log violations; Enforce = block violating resources
  validationFailureAction: Audit
