# Organisational ServiceAccounts (app SAs are created per-service by existing templates)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-admin
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devops-admin
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [services, secrets, configmaps, pods, pods/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: readonly
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-admin-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: devops-admin
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: devops-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readonly-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: readonly
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: readonly
  apiGroup: rbac.authorization.k8s.io
