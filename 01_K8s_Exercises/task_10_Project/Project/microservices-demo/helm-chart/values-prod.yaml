# Complete values for the prod environment.
# Usage: helm upgrade --install boutique ./helm-chart -f values-prod.yaml -n google-microservice

images:
  repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo
  tag: "v0.10.6"

serviceAccounts:
  create: true
  annotations: {}
  annotationsOnlyForCartservice: false

networkPolicies:
  create: true

opentelemetryCollector:
  create: false
  name: opentelemetrycollector
  projectId: "PROJECT_ID"

googleCloudOperations:
  profiler: false
  tracing: false
  metrics: false

seccompProfile:
  enable: true
  type: RuntimeDefault

securityContext:
  enable: true

adService:
  create: true
  name: adservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 5, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 200m
      memory: 180Mi
    limits:
      cpu: 300m
      memory: 300Mi

cartService:
  create: true
  name: cartservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 6, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

checkoutService:
  create: true
  name: checkoutservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 6, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi

currencyService:
  create: true
  name: currencyservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 6, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi

emailService:
  create: true
  name: emailservice
  antiAffinity: false
  hpa: { enabled: false }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

frontend:
  create: true
  name: frontend
  externalService: true
  cymbalBranding: false
  platform: local
  singleSharedSession: false
  antiAffinity: true
  hpa: { enabled: true, min: 3, max: 10, cpu: 60, memory: 75 }
  pdb: { enabled: true, minAvailable: 2 }
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi

loadGenerator:
  create: false
  name: loadgenerator
  checkFrontendInitContainer: true
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

paymentService:
  create: true
  name: paymentservice
  antiAffinity: false
  hpa: { enabled: false }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

productCatalogService:
  create: true
  name: productcatalogservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 8, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  extraLatency: ""
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi

recommendationService:
  create: true
  name: recommendationservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 6, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 200m
      memory: 440Mi
    limits:
      cpu: 400m
      memory: 900Mi

shippingService:
  create: true
  name: shippingservice
  antiAffinity: true
  hpa: { enabled: true, min: 2, max: 6, cpu: 70, memory: 80 }
  pdb: { enabled: true, minAvailable: 1 }
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi

cartDatabase:
  type: redis
  connectionString: "redis-cart:6379"
  inClusterRedis:
    create: true
    name: redis-cart
    publicRepository: true

shoppingAssistantService:
  create: false
  name: shoppingassistantservice

resourceQuota:
  configmaps: "12"
  limitsCpu: "12"
  limitsMemory: 16Gi
  requestsCpu: "6"
  requestsMemory: 8Gi
  persistentVolumeClaims: "5"
  secrets: "4"

limitRange:
  default:
    cpu: 200m
    memory: 128Mi
  defaultRequest:
    cpu: 100m
    memory: 64Mi
  max:
    cpu: 1000m
    memory: 1Gi
  min:
    cpu: 50m
    memory: 64Mi

ingress:
  enabled: true
  className: nginx
  host: "boutique.example.com"
  tls:
    enabled: true
    secretName: "boutique-prod-tls"
    clusterIssuer: "selfsigned-cluster-issuer"

kyvernoPolicies:
  enabled: true
  validationFailureAction: Enforce
