apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservices-ingress
  namespace: google-microservice
  annotations:
    # cert-manager reads this to auto-provision and renew the TLS certificate
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - boutique.example.com
    secretName: boutique-tls
  rules:
  - host: boutique.example.com
    http:
      paths:
      - backend:
          service:
            name: frontend
            port:
              number: 80
        path: /
        pathType: Prefix