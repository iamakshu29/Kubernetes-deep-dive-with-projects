apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-admin-binding
  namespace: google-microservice
subjects:
- kind: ServiceAccount
  name: devops-admin
  namespace: google-microservice
roleRef:
  kind: Role
  name: devops-admin
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-binding
  namespace: google-microservice
subjects:
- kind: ServiceAccount
  name: deployer
  namespace: google-microservice
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readonly-binding
  namespace: google-microservice
subjects:
- kind: ServiceAccount
  name: readonly
  namespace: google-microservice
roleRef:
  kind: Role
  name: readonly
  apiGroup: rbac.authorization.k8s.io
