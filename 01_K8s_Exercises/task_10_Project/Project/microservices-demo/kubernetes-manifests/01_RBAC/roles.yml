# Deployer Role for CI/CD Deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: google-microservice
rules:
- apiGroups:
  - ""
  resources:
  - services
  - secrets
  - configmaps
  - pods
  - pods/status
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

---
# DevOps Admin Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devOps-admin
  namespace: google-microservice
rules:
- apiGroups:
  - ""
  resources:
  - '*'
  verbs:
  - '*'

---
# Read-only Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: readonly
  namespace: google-microservice
rules:
- apiGroups:
  - ""
  resources:
  - '*'
  verbs:
  - list
  - watch
  - get
