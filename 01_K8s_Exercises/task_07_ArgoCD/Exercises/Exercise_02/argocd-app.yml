apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: petclinic-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iamakshu29/devops-cicd-toolchain.git
    targetRevision: main
    path: Reference_Project/kubernetes-manifest/
  destination:
    server: https://kubernetes.default.svc
    namespace: petclinic-dev
  syncPolicy: {}   # manual sync — ArgoCD detects drift but does not auto-apply