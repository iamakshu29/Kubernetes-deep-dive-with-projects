apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: secure-deploy
  name: secure-deploy
  namespace: team-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-deploy
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: secure-deploy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - image: nginx:1.25
        name: nginx
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources: {}
status: {}
