apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer-mini-project
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mini-project-tls
  namespace: team-alpha
spec:
  secretName: alpha-tls-secret
  issuerRef:
    name: selfsigned-issuer-mini-project
    kind: ClusterIssuer
  dnsNames:
  - frontend.team-alpha.svc.cluster.local
  - frontend.team-alpha.svc
  - frontend.team-alpha
