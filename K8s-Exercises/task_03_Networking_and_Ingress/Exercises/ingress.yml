apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: team-alpha
  annotations:
    # Strips the matched prefix before forwarding to the backend.
    # $2 captures everything after /api — so /api/users becomes /users on the pod.
    # Without this, the pod receives /api/users and returns 404 (nginx only serves at /).
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  tls:
  - hosts:
    - frontend.local
    - api.local
    secretName: alpha-tls-secret
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - backend:
          service:
            name: frontend-svc
            port:
              number: 80
        path: /
        pathType: Prefix
      - backend:
          service:
            name: api-svc
            port:
              number: 80
        path: /api(/|$)(.*)
        pathType: ImplementationSpecific
  - host: frontend.local
    http:
      paths:
      - backend:
          service:
            name: frontend-svc
            port:
              number: 80
        path: /
        pathType: Exact
  - host: api.local
    http:
      paths:
      - backend:
          service:
            name: api-svc
            port:
              number: 80
        path: /
        pathType: Exact
status:
  loadBalancer: {}
