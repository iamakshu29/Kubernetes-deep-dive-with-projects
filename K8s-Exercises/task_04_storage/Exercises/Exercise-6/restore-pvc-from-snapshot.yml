apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-restored
  namespace: team-alpha
spec:
  storageClassName: csi-hostpath-sc
  dataSource:
    name: postgres-snapshot-before-migration
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi