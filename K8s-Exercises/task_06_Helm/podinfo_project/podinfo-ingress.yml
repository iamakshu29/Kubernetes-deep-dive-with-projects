apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  creationTimestamp: null
  name: podinfo-ingress
  namespace: demo
spec:
  tls:
    - secretName: podinfo-app-tls-secret
      hosts:
      - podinfo.local
  ingressClassName: nginx
  rules:
  - host: podinfo.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: podinfo-app
            port:
              number: 9898
status:
  loadBalancer: {}
