apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.name }}-app
  name: {{ .Values.name }}-app
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    protocol: {{ .Values.service.protocol }}
    targetPort: {{ .Values.service.targetPort }}
  selector:
    app: {{ .Values.name }}-app