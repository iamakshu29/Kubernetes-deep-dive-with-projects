apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: team-alpha
  labels:
    app: postgres
spec:
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: postgres # has to match .spec.template.metadata.labels
  serviceName: "postgres"
  replicas: 3
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alpha-secrets
              key: DB_PASSWORD

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: team-alpha
  labels:
    app: postgres
spec:
  ports:
  - name: db
    port: 5432
    targetPort: 5432
  clusterIP: None
  selector:
    app: postgres