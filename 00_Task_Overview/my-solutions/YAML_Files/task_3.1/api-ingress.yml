apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  creationTimestamp: null
  name: app-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - backend:
          service:
            name: users-api-svc
            port:
              number: 80
        path: /api/users
        pathType: Exact
      - backend:
          service:
            name: orders-api-svc
            port:
              number: 80
        path: /api/orders
        pathType: Exact
      - backend:
          service:
            name: main-api-svc
            port:
              number: 80
        path: /
        pathType: Exact
status:
  loadBalancer: {}
